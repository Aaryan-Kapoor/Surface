<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
  <title>Pair with this Surface</title>
  <meta name="color-scheme" content="dark light">
  <style>
    /* This page is standalone — it is served before the app's stylesheet is
       reachable — so the tokens are copied rather than imported. They are the
       same values client/style.css uses; the pairing screen is the first thing
       a new device sees and should not look like a different product.

       The card is a dialog, so it is built to the same spec as .modal-panel in
       the app: overlay plane, 18px radius, 32/32/28 padding, and the same
       eyebrow / title / lede scale. Anything you click inside it takes the
       interactive plane. */
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --fg: #ffffff;
      --fg-muted: rgba(255, 255, 255, 0.62);
      --fg-faint: rgba(255, 255, 255, 0.40);
      --fg-ghost: rgba(255, 255, 255, 0.22);
      --overlay: #020202;
      --interactive: #121212;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.20);
      --danger: #ff4d4a;
      --ok: #34d399;
      --shadow-pop: 0 40px 90px -30px rgba(0, 0, 0, 0.85);
      --r-md: 10px;
      --r-card: 18px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-swift: cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f6f6f7;
        --fg: #0b0c0e;
        --fg-muted: rgba(11, 12, 14, 0.62);
        --fg-faint: rgba(11, 12, 14, 0.42);
        --fg-ghost: rgba(11, 12, 14, 0.26);
        --overlay: #ffffff;
        --interactive: #ffffff;
        --line: rgba(0, 0, 0, 0.10);
        --line-strong: rgba(0, 0, 0, 0.22);
        --danger: #d92d20;
        --ok: #067647;
        --shadow-pop: 0 40px 90px -30px rgba(16, 18, 22, 0.28);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: var(--fg); color: var(--bg); }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      position: relative;
    }
    body::before { content: ""; position: fixed; inset: 0; background: var(--bg); z-index: -2; }
    /* The app's single wash from the top edge (#app > div::before). It carries
       an opacity of 0.05 there; painted straight onto the body here it was a
       full-strength white gradient, which made the first screen a new device
       ever sees noticeably brighter than the app it is pairing with. */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(1200px 520px at 50% -260px, var(--fg), transparent 70%);
      opacity: 0.05;
    }
    .card {
      width: 100%; max-width: 400px;
      background: var(--overlay);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 32px 32px 28px;
      box-shadow: var(--shadow-pop);
      animation: card-in .5s var(--ease-out) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    /* The wordmark, in the shell's own type — Surface has no mark, and the
       name set large in the system stack is the identity everywhere else. This
       page is the product's front door rather than a section of it, so the
       name leads and the task line sits under it. */
    .brand {
      text-align: center;
      font-size: 30px; font-weight: 700; letter-spacing: -0.035em; line-height: 1;
      color: var(--fg); margin-bottom: 7px;
    }
    /* The task line, not a second headline. Set at title weight and size it
       competed with the wordmark directly above it, and the lede under it said
       a third time what step 1's hint already says. */
    .card > h1 {
      text-align: center;
      font-size: 14px; font-weight: 550; letter-spacing: 0; line-height: 1.4;
      color: var(--fg-muted); margin: 0 0 26px;
    }
    /* Numbered steps. Pairing is a three-move sequence that spans two machines
       — run a command over there, carry what it prints back here, then name
       this screen — and a flat stack of fields gave no clue that the token has
       to be fetched before anything can be typed. */
    .steps { list-style: none; display: grid; gap: 24px; margin: 0 0 24px; padding: 0; }
    .step { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
    .step-n {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid var(--line-strong); color: var(--fg-faint);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1;
      margin-top: 1px; flex: 0 0 auto;
    }
    .step-body { min-width: 0; }
    .step-title { font-size: 14px; font-weight: 600; letter-spacing: -0.008em; margin: 4px 0 10px; }
    .step-title label { cursor: pointer; }
    .hint { margin: 8px 0 0; font-size: 12px; color: var(--fg-faint); line-height: 1.45; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; white-space: nowrap; }
    input {
      width: 100%; padding: 11px 13px;
      background: var(--interactive); color: var(--fg);
      border: 1px solid var(--line); border-radius: var(--r-md);
      font-size: 16px; letter-spacing: .14em; text-transform: uppercase;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      caret-color: var(--fg);
      transition: border-color .18s var(--ease-swift), background .18s var(--ease-swift), box-shadow .18s var(--ease-swift);
    }
    input.plain { text-transform: none; letter-spacing: normal; font-family: inherit; font-size: 15px; }
    input::placeholder { color: var(--fg-ghost); }
    input:hover { border-color: var(--line-strong); }
    input:focus {
      outline: none; border-color: var(--fg);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 10%, transparent);
    }
    button.primary, button.linkish { width: 100%; }
    button.primary {
      padding: 12px 16px; border-radius: var(--r-md);
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background-color .16s var(--ease-swift), color .16s var(--ease-swift), border-color .16s var(--ease-swift), opacity .16s var(--ease-swift);
    }
    button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    button.primary { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); }
    button.primary:hover { opacity: .88; }
    button.primary:active { transform: scale(.985); }
    button.primary:disabled { opacity: .45; cursor: default; }
    .linkish {
      margin-top: 14px; padding: 6px 0; background: transparent; border: 0;
      color: var(--fg-faint); font: inherit; font-size: 12.5px; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color .16s var(--ease-swift);
    }
    .linkish:hover { color: var(--fg); }
    .linkish:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    /* The token has to come from somewhere, and the somewhere is a command on
       another machine. Naming it here saves the walk back to the docs. It is
       the bare `surface pair` on purpose: --name would collide with the device
       name field two rows below, and one of them would have to lose.

       Styled as a *terminal line*, not a field. On the interactive plane with a
       1px border and a 10px radius it was the same object as the two inputs
       under it — a third box to type into. The shell prompt, the flush-left
       mono, the copy glyph and the whole row being the button are what say
       "this is output from somewhere else, take it" instead of "fill me in". */
    .cmd {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      background: var(--interactive);
      border: 0;
      border-left: 2px solid var(--line-strong);
      border-radius: 0 var(--r-md) var(--r-md) 0;
      padding: 11px 12px 11px 13px;
      margin: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background .16s var(--ease-swift), border-color .16s var(--ease-swift);
    }
    .cmd:hover { border-left-color: var(--fg); }
    .cmd:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .cmd:active { transform: scale(.995); }
    .cmd-prompt {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; color: var(--fg-ghost); user-select: none; flex: 0 0 auto;
    }
    .cmd code {
      flex: 1; min-width: 0;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; color: var(--fg);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      user-select: all;
    }
    .cmd-glyph { flex: 0 0 auto; display: flex; color: var(--fg-faint); transition: color .16s var(--ease-swift); }
    .cmd-glyph svg { display: block; }
    .cmd:hover .cmd-glyph { color: var(--fg); }
    .cmd-label {
      flex: 0 0 auto; font-size: 11.5px; font-weight: 550;
      color: var(--fg-faint); transition: color .16s var(--ease-swift);
    }
    .cmd:hover .cmd-label { color: var(--fg); }
    .cmd--done .cmd-glyph, .cmd--done .cmd-label { color: var(--ok); }
    .msg { margin-top: 14px; text-align: center; font-size: 12px; line-height: 1.5; min-height: 18px; }
    .msg.error { color: var(--danger); }
    .msg.ok { color: var(--fg); }
    .msg.info { color: var(--fg-faint); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Surface</div>
    <h1>Connect this device</h1>

    <form id="pair-form" autocomplete="off">
      <ol class="steps">
        <li class="step">
          <span class="step-n" aria-hidden="true">1</span>
          <div class="step-body">
            <h2 class="step-title">Run command</h2>
            <button type="button" class="cmd" id="cmd-copy">
              <span class="cmd-prompt" aria-hidden="true">$</span>
              <code id="cmd-text">surface pair</code>
              <span class="cmd-glyph" id="cmd-glyph" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="15" height="15"><rect x="5.6" y="5.6" width="8.4" height="8.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.9 3.6V3a1.6 1.6 0 0 0-1.6-1.6H3.6A1.6 1.6 0 0 0 2 3v5.7a1.6 1.6 0 0 0 1.6 1.6h.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </span>
              <span class="cmd-label" id="cmd-label">Copy</span>
            </button>
            <p class="hint">Run this on the machine hosting Surface.</p>
          </div>
        </li>

        <li class="step">
          <span class="step-n" aria-hidden="true">2</span>
          <div class="step-body">
            <h2 class="step-title"><label for="token">Enter pairing token</label></h2>
            <input id="token" name="token" type="text" inputmode="latin" autocapitalize="characters"
                   spellcheck="false" placeholder="UKKD5N47XXZ8" maxlength="24" required>
            <p class="hint">Paste the token printed in your terminal.</p>
          </div>
        </li>

        <li class="step">
          <span class="step-n" aria-hidden="true">3</span>
          <div class="step-body">
            <h2 class="step-title"><label for="device-name">Name this device</label></h2>
            <input id="device-name" name="device-name" type="text" inputmode="text" autocapitalize="words"
                   spellcheck="false" placeholder="Phone" maxlength="40" class="plain" required>
            <p class="hint">How you will recognise it in <span class="mono">surface devices</span>.</p>
          </div>
        </li>
      </ol>

      <button class="primary" id="submit" type="submit">Connect device</button>
    </form>
    <button class="linkish" id="reload" type="button">Already paired? Reload app</button>
    <div class="msg info" id="msg"></div>
  </div>

  <script>
    (function () {
      var form = document.getElementById("pair-form");
      var input = document.getElementById("token");
      var nameInput = document.getElementById("device-name");
      var submitBtn = document.getElementById("submit");
      var msg = document.getElementById("msg");

      // Clipboard, with the execCommand fallback: this page is reached over
      // plain HTTP on a LAN more often than not, and navigator.clipboard is
      // gated on a secure context.
      var copyBtn = document.getElementById("cmd-copy");

      // execCommand is the fallback, not the loser of a one-shot check: the
      // async clipboard is refused for reasons a feature test cannot see
      // (permissions policy, a denied prompt), so a rejection has to fall
      // through rather than report failure. Mirrors copyToClipboard() in app.js.
      function legacyCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.opacity = "0";
        ta.style.pointerEvents = "none";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        ta.remove();
        return ok;
      }

      var cmdLabel = document.getElementById("cmd-label");
      var cmdGlyph = document.getElementById("cmd-glyph");
      var GLYPH_COPY = cmdGlyph.innerHTML;
      var GLYPH_DONE = '<svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 8.4l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      var cmdResetTimer = null;

      copyBtn.addEventListener("click", function () {
        var text = document.getElementById("cmd-text").textContent;
        // Only the label and the glyph change — the button's own text content
        // is the command, and rewriting it would delete what was just copied.
        var done = function (ok) {
          cmdLabel.textContent = ok ? "Copied" : "Copy failed";
          cmdGlyph.innerHTML = ok ? GLYPH_DONE : GLYPH_COPY;
          copyBtn.classList.toggle("cmd--done", ok);
          if (cmdResetTimer) clearTimeout(cmdResetTimer);
          cmdResetTimer = setTimeout(function () {
            cmdLabel.textContent = "Copy";
            cmdGlyph.innerHTML = GLYPH_COPY;
            copyBtn.classList.remove("cmd--done");
          }, 1800);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(
            function () { done(true); },
            function () { done(legacyCopy(text)); },
          );
          return;
        }
        done(legacyCopy(text));
      });

      // Friendly default device name guessed from the user agent. The user can
      // (and should) override it — the label is how `surface devices`,
      // revocation, and `--on <device>` targeting refer to this screen.
      function guessDeviceName() {
        var ua = navigator.userAgent;
        if (/iPhone/.test(ua)) return "iPhone";
        if (/iPad/.test(ua)) return "iPad";
        if (/Android/.test(ua)) return "Android";
        if (/Macintosh/.test(ua)) return "Mac";
        if (/Windows/.test(ua)) return "Windows";
        if (/Linux/.test(ua)) return "Linux";
        return "Device";
      }
      nameInput.value = guessDeviceName();

      function setMsg(text, kind) {
        msg.textContent = text || "";
        msg.className = "msg " + (kind || "info");
      }

      // 1. Read the token from the URL fragment, then 2. immediately strip it so
      // it never lingers in history, the address bar, or referrer headers.
      var hash = window.location.hash || "";
      var hashToken = "";
      var m = hash.match(/(?:^#|&)token=([^&]+)/);
      if (m) {
        try { hashToken = decodeURIComponent(m[1]); } catch (e) { hashToken = m[1]; }
      }
      if (hashToken) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }

      function bootstrap(credential) {
        var label = (nameInput.value || "").trim() || guessDeviceName();
        submitBtn.disabled = true;
        setMsg("Pairing…", "info");
        fetch("/api/auth/bootstrap", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: credential, label: label }),
        })
          .then(function (res) {
            return res.json().then(function (body) { return { status: res.status, body: body }; });
          })
          .then(function (r) {
            if (r.status >= 200 && r.status < 300 && r.body && r.body.authenticated) {
              setMsg("Paired. Opening Surface…", "ok");
              window.location.replace("/");
              return;
            }
            submitBtn.disabled = false;
            var err = (r.body && r.body.error) || "Pairing failed.";
            setMsg(err, "error");
          })
          .catch(function () {
            submitBtn.disabled = false;
            setMsg("Server unreachable. Check your connection and try again.", "error");
          });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        // The token is printed as 12 unbroken characters, but it arrives here
        // through a clipboard and a human: stray whitespace, and the dashes
        // people add out of habit, should not read as a wrong token.
        var credential = input.value.replace(/[\s-]/g, "").trim();
        if (!credential) { setMsg("Enter a pairing token.", "error"); return; }
        bootstrap(credential);
      });

      document.getElementById("reload").addEventListener("click", function () {
        window.location.replace("/");
      });

      // 3. Prefill when the token arrived in the URL. No auto-submit: the user
      // names the device first — that label is its identity from here on.
      if (hashToken) {
        input.value = hashToken;
        setMsg("Token received — name this device and connect.", "info");
        nameInput.focus();
        nameInput.select();
      } else {
        input.focus();
      }
    })();
  </script>
</body>
</html>
