name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      llm-e2e:
        description: "Also run the paid OpenRouter LLM e2e (needs OPENROUTER_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Actions are pinned to commit SHAs (comment = the tag reviewed); Dependabot
# keeps the pins fresh. Every checkout drops credential persistence — no job
# here needs to push.
jobs:
  # Packs the tarball ONCE. Every install-shaped job downloads this artifact,
  # so they all provably test the same bytes — and none of them repeat
  # npm ci + prepare.
  pack:
    name: Pack release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tarball
          path: surface-display-*.tgz
          retention-days: 7
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node dist/surface.mjs --help
      - run: node dist/surface.mjs --version

  # Node 22 is the supported floor; Node 24 is the current LTS — the version
  # a new user actually has. Both run on every OS we ship to: native-module
  # prebuild coverage is per-platform × per-ABI, so a Linux pass proves
  # nothing about win32/darwin.
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: bash scripts/check-leaks.sh

  # The install path a real user hits: global-install the packed tarball, then
  # surface service install → health → logs → uninstall against the REAL native
  # supervisor on every OS — Scheduled Task on Windows, launchd on macOS, and a
  # real systemd user manager on Linux (booted via loginctl enable-linger,
  # since hosted runners have no login session). Nothing is mocked. Runs on
  # Node 24 — the version a new user installs with.
  service-smoke:
    name: Service smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Boot a user systemd manager (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(whoami)"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tarball
      - name: Global-install the tarball
        shell: bash
        run: npm install -g ./surface-display-*.tgz
      - name: Install, health-gate, inspect, uninstall
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_RUNTIME_DIR
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          fi
          surface --version
          surface service install --port 3456 --content-port 3556 --data-dir "$RUNNER_TEMP/surface-data" --timeout 90
          # No flags below: install persisted them per-name, teardown must find them.
          surface service health
          surface service status
          surface service logs
          surface service uninstall
          if surface service health --port 3456; then
            echo "service still answering after uninstall" >&2
            exit 1
          fi

  # A brand-new laptop is a machine with Node and nothing else — no python,
  # no make, no g++. Hosted runners all carry compilers, which silently
  # rescue a native module whose prebuilt binary is missing for the running
  # Node version — the exact failure a first-time user hits. So this job
  # global-installs the packed tarball inside toolchain-free node:*-slim
  # containers and drives the CLI against a booted server.
  fresh-install:
    name: Fresh install (Node ${{ matrix.node-version }}, no toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tarball
          path: ${{ runner.temp }}/pkg
      - run: bash scripts/test-fresh-install.sh --tarball "$RUNNER_TEMP"/pkg/surface-display-*.tgz ${{ matrix.node-version }}

  # The whole new-user path on the machine a new user actually has: stock
  # Ubuntu + real systemd, a non-root user, user-owned Node 24, no
  # compilers. Walks INSTALL_FOR_AGENTS.md end to end: tarball install →
  # surface service install (systemd+logind, health-gated) → skill install
  # → sanity checks → first surface + live state → restart → uninstall.
  new-user-e2e:
    name: New-user e2e (systemd container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tarball
          path: ${{ runner.temp }}/pkg
      - run: bash scripts/test-new-user-e2e.sh --tarball "$RUNNER_TEMP"/pkg/surface-display-*.tgz

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # The paid, LLM-in-the-loop e2e (test/e2e.ts): an OpenRouter model drives
  # the artifact API against a CI-local server. Opt-in — run the workflow
  # manually with llm-e2e checked. Never part of the required set.
  llm-e2e:
    name: LLM e2e (OpenRouter, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.llm-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run e2e against a CI-local server
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is not configured" >&2
            exit 1
          fi
          export SURFACE_DATA_DIR="$RUNNER_TEMP/surface-e2e"
          node dist/server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 30); do
            node dist/surface.mjs list >/dev/null 2>&1 && break
            sleep 1
          done
          node dist/surface.mjs list >/dev/null
          SURFACE_TEST_E2E=1 SURFACE_TEST_ALLOW_LIVE=1 npm run test:e2e
          kill "$server_pid"

  # Publishes only from a v* tag, only when every job above is green.
  # Tokenless: npm trusted publishing via OIDC (id-token: write). Configure
  # this repo + workflow as the trusted publisher in the surface-display
  # package settings on npmjs.com — the first-ever publish must be run
  # locally, since npm only lets existing packages add a trusted publisher.
  # Provenance is attested automatically on trusted publishes. After npm,
  # a GitHub Release is created with the CHANGELOG section as notes.
  publish:
    name: Publish to npm
    needs: [pack, package, test, service-smoke, fresh-install, new-user-e2e, audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release; the npm publish itself is OIDC
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Update npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tarball
          path: ${{ runner.temp }}/pkg
      - name: Tag must match package.json version
        run: |
          node -e "
            const v = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME;
            if ('v' + v !== tag) {
              console.error('tag ' + tag + ' does not match package.json version ' + v);
              process.exit(1);
            }
          "
      - name: CHANGELOG must have a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '$0 ~ "^## "ver"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section '## $version' (or it is empty) — write the release notes first" >&2
            exit 1
          fi
      # Publish the EXACT tarball the gates tested — a bare `npm publish`
      # would silently repack (rerunning prepare under a different npm) and
      # ship bytes nothing validated. Skipping an already-published version
      # keeps reruns alive: npm versions are immutable, so a failed later
      # step must not dead-end the job at a doomed republish.
      - name: Publish the gated tarball to npm
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          tgzs=("$RUNNER_TEMP"/pkg/surface-display-*.tgz)
          if [ "${#tgzs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball artifact, found ${#tgzs[@]}" >&2
            exit 1
          fi
          if [ "$(basename "${tgzs[0]}")" != "surface-display-$version.tgz" ]; then
            echo "tarball ${tgzs[0]} does not match tag version $version" >&2
            exit 1
          fi
          if [ "$(npm view "surface-display@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "surface-display@$version already on npm — resuming release convergence"
          else
            npm publish "${tgzs[0]}" --access public
          fi
      - name: GitHub Release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
