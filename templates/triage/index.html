<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage</title>
<style>
  :root {
    --bg: #0a0a0a;
    --interactive: #121212;
    --fg: #ffffff;
    --fg-muted: rgba(255,255,255,.62);
    --fg-faint: rgba(255,255,255,.40);
    --fg-ghost: rgba(255,255,255,.22);
    --line: rgba(255,255,255,.12);
    --line-strong: rgba(255,255,255,.34);
    --ok: #34d399;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f6f7; --interactive: #ffffff; --fg: #0b0c0e;
      --fg-muted: rgba(11,12,14,.62); --fg-faint: rgba(11,12,14,.42); --fg-ghost: rgba(11,12,14,.22);
      --line: rgba(11,12,14,.12); --line-strong: rgba(11,12,14,.34); --ok: #067647;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100%; overflow: hidden;
    touch-action: manipulation;
  }
  header { flex: none; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 20px 24px 0; }
  h1 { margin: 0; font-size: 19px; font-weight: 620; letter-spacing: -.02em; }
  .hint { font-size: 13.5px; color: var(--fg-muted); }

  .stage { flex: 1 1 auto; min-height: 0; padding: 16px 24px 8px; display: flex; }
  .plane {
    position: relative; flex: 1 1 auto; min-width: 0;
    background: var(--interactive);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    touch-action: none;
  }
  /* Quadrant guides, not decoration: the whole point is that a position means
     something, so the divisions have to be visible without competing. */
  .plane::before, .plane::after {
    content: ""; position: absolute; background: var(--line);
  }
  .plane::before { left: 0; right: 0; top: 50%; height: 1px; }
  .plane::after { top: 0; bottom: 0; left: 50%; width: 1px; }

  .quad {
    position: absolute; font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: var(--fg-ghost);
    pointer-events: none; user-select: none;
  }
  .q-tl { top: 12px; left: 14px; }
  .q-tr { top: 12px; right: 14px; }
  .q-bl { bottom: 12px; left: 14px; }
  .q-br { bottom: 12px; right: 14px; }

  .axis {
    position: absolute; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fg-faint);
    pointer-events: none; user-select: none;
  }
  .axis-x { bottom: 6px; left: 50%; transform: translateX(-50%); }
  .axis-y { left: 6px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: left center; }

  .chip {
    position: absolute;
    display: flex; flex-direction: column; gap: 2px;
    max-width: 210px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transform: translate(-50%, -50%);
    transition: box-shadow .15s ease;
  }
  .chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .chip .label { font-size: 13px; font-weight: 550; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .meta { font-size: 11.5px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.dragging { cursor: grabbing; box-shadow: 0 12px 34px rgba(0,0,0,.5); z-index: 5; }

  .tray {
    flex: none;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 8px 24px 0;
    min-height: 44px;
  }
  .tray .chip { position: static; transform: none; }
  .tray-label { font-size: 12px; color: var(--fg-faint); margin-right: 4px; }

  footer {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 24px 20px;
  }
  .spacer { flex: 1 1 auto; }
  .send {
    font: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--bg); background: var(--fg);
    border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  }
  .send:disabled { opacity: .3; cursor: default; }
  .send:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .note { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-muted); min-height: 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }

  @media (max-width: 620px) {
    header, .stage, .tray, footer { padding-left: 14px; padding-right: 14px; }
    .chip { max-width: 150px; }
  }
  @media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    <span class="hint">Drag each one where you think it belongs. I read the positions, not the order.</span>
  </header>

  <div class="stage">
    <div class="plane" id="plane">
      <span class="quad q-tl" id="q-tl"></span>
      <span class="quad q-tr" id="q-tr"></span>
      <span class="quad q-bl" id="q-bl"></span>
      <span class="quad q-br" id="q-br"></span>
      <span class="axis axis-x" id="axis-x"></span>
      <span class="axis axis-y" id="axis-y"></span>
    </div>
  </div>

  <div class="tray" id="tray"><span class="tray-label" id="tray-label">Unplaced</span></div>

  <footer>
    <div class="note" id="note"></div>
    <span class="spacer"></span>
    <button class="send" id="send" type="button">Send ranking</button>
  </footer>

  <script>
  (function () {
    function init() {
      var Surface = window.Surface || {
        state: {}, onState: function () { return function () {}; },
        action: function () { return Promise.resolve(); }
      };
      var P = window.__TEMPLATE_PARAMS || {};
      var quads = Array.isArray(P.quadrants) && P.quadrants.length === 4
        ? P.quadrants.map(String)
        : ["Do now", "Plan it", "Drop it", "Delegate"];

      var raw = Array.isArray(P.items) ? P.items : [];
      var items = raw.map(function (it, i) {
        if (it && typeof it === "object") {
          return {
            id: String(it.id != null ? it.id : "item-" + (i + 1)),
            label: String(it.label != null ? it.label : it.id),
            meta: it.meta != null ? String(it.meta) : ""
          };
        }
        return { id: "item-" + (i + 1), label: String(it), meta: "" };
      });

      var plane = document.getElementById("plane");
      var tray = document.getElementById("tray");
      var trayLabel = document.getElementById("tray-label");
      var sendBtn = document.getElementById("send");
      var noteEl = document.getElementById("note");

      document.getElementById("q-tl").textContent = quads[0];
      document.getElementById("q-tr").textContent = quads[1];
      document.getElementById("q-bl").textContent = quads[2];
      document.getElementById("q-br").textContent = quads[3];
      document.getElementById("axis-x").textContent = String(P.x_label || "Effort") + " →";
      document.getElementById("axis-y").textContent = String(P.y_label || "Impact") + " →";

      var placements = {};   // id -> [x, y] with y measured from the bottom
      var chips = {};

      function quadrantOf(x, y) {
        if (y >= 0.5) return x < 0.5 ? quads[0] : quads[1];
        return x < 0.5 ? quads[2] : quads[3];
      }

      function build() {
        items.forEach(function (it) {
          var c = document.createElement("div");
          c.className = "chip";
          c.tabIndex = 0;
          c.setAttribute("data-id", it.id);

          var l = document.createElement("span");
          l.className = "label";
          l.textContent = it.label;
          c.appendChild(l);
          if (it.meta) {
            var m = document.createElement("span");
            m.className = "meta";
            m.textContent = it.meta;
            c.appendChild(m);
          }

          attachDrag(c, it.id);
          chips[it.id] = c;
          tray.appendChild(c);
        });
      }

      function attachDrag(chip, id) {
        var dragging = false;
        var grabDx = 0, grabDy = 0;

        chip.addEventListener("pointerdown", function (e) {
          var fromTray = chip.parentNode !== plane;
          // Reparent *before* capturing: moving a node between parents drops an
          // active pointer capture, which left a chip picked up out of the tray
          // following nothing at all.
          if (fromTray) {
            plane.appendChild(chip);
            place(id, coordsAt(e.clientX, e.clientY, 0, 0), false);
          }
          dragging = true;
          chip.setPointerCapture(e.pointerId);
          chip.classList.add("dragging");
          if (fromTray) {
            // It just jumped under the cursor, so there is no grab offset to
            // preserve. Measuring one against the tray position it no longer
            // has is what made the chip trail the pointer by its old distance.
            grabDx = 0;
            grabDy = 0;
          } else {
            // Keep the point you grabbed under the cursor; a chip that jumps to
            // centre on pick-up makes precise placement guesswork.
            var r = chip.getBoundingClientRect();
            grabDx = e.clientX - (r.left + r.width / 2);
            grabDy = e.clientY - (r.top + r.height / 2);
          }
        });
        chip.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          place(id, coordsAt(e.clientX, e.clientY, grabDx, grabDy), false);
        });
        function done(e) {
          if (!dragging) return;
          dragging = false;
          chip.classList.remove("dragging");
          // Deliberately silent. Every drop used to fire an action, so a single
          // considered layout arrived at the agent as a dozen half-finished
          // ones — the ranking is what you meant, and Send is when you mean it.
          refresh();
        }
        chip.addEventListener("pointerup", done);
        chip.addEventListener("pointercancel", done);

        // Placeable without a pointer at all.
        chip.addEventListener("keydown", function (e) {
          var step = e.shiftKey ? 0.1 : 0.02;
          var p = placements[id] || [0.5, 0.5];
          var moved = true;
          if (e.key === "ArrowLeft") p = [p[0] - step, p[1]];
          else if (e.key === "ArrowRight") p = [p[0] + step, p[1]];
          else if (e.key === "ArrowUp") p = [p[0], p[1] + step];
          else if (e.key === "ArrowDown") p = [p[0], p[1] - step];
          else moved = false;
          if (!moved) return;
          e.preventDefault();
          if (chip.parentNode !== plane) plane.appendChild(chip);
          place(id, [p[0], p[1]], false);
          refresh();
        });
      }

      function coordsAt(clientX, clientY, dx, dy) {
        var r = plane.getBoundingClientRect();
        var x = (clientX - dx - r.left) / r.width;
        var y = 1 - (clientY - dy - r.top) / r.height;
        return [x, y];
      }

      function place(id, xy, silent) {
        var x = Math.min(1, Math.max(0, xy[0]));
        var y = Math.min(1, Math.max(0, xy[1]));
        placements[id] = [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000];
        var chip = chips[id];
        if (chip) {
          chip.style.left = (x * 100) + "%";
          chip.style.top = ((1 - y) * 100) + "%";
        }
        if (!silent) refresh();
      }

      function refresh() {
        var placed = Object.keys(placements).length;
        sendBtn.disabled = placed === 0;
        var left = items.length - placed;
        trayLabel.textContent = left ? "Unplaced" : "";
        tray.style.display = left ? "" : "none";
      }

      sendBtn.addEventListener("click", function () {
        var out = items
          .filter(function (it) { return placements[it.id]; })
          .map(function (it) {
            var p = placements[it.id];
            return {
              id: it.id, label: it.label,
              x: p[0], y: p[1], quadrant: quadrantOf(p[0], p[1])
            };
          });
        Surface.action("ranked", { items: out, x_label: String(P.x_label || "Effort"), y_label: String(P.y_label || "Impact") });
        sendBtn.disabled = true;
        say("Sent — reading your layout.");
      });

      function say(text) {
        noteEl.textContent = "";
        if (!text) return;
        var d = document.createElement("span");
        d.className = "dot";
        noteEl.appendChild(d);
        noteEl.appendChild(document.createTextNode(text));
      }

      function render() {
        var st = Surface.state || {};
        var incoming = st.placements;
        if (typeof incoming === "string") {
          try { incoming = JSON.parse(incoming); } catch (err) { incoming = null; }
        }
        if (incoming && typeof incoming === "object") {
          Object.keys(incoming).forEach(function (id) {
            var p = incoming[id];
            if (!chips[id] || !p) return;
            var x = Array.isArray(p) ? p[0] : p.x;
            var y = Array.isArray(p) ? p[1] : p.y;
            if (typeof x !== "number" || typeof y !== "number") return;
            if (chips[id].parentNode !== plane) plane.appendChild(chips[id]);
            place(id, [x, y], true);
          });
          refresh();
        }
        if (st.note) say(String(st.note));
      }

      window.addEventListener("resize", function () {
        Object.keys(placements).forEach(function (id) { place(id, placements[id], true); });
      });

      build();
      refresh();
      Surface.onState(render);
      render();
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
