<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #050505; color: #f4f4f1; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { min-height: 46px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.76); }
  header:empty { display: none; }
  h1 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 750; letter-spacing: 0; }
  main { flex: 1; min-height: 0; display: grid; place-items: center; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  .error { max-width: 58ch; padding: 24px; color: rgba(244,244,241,.72); line-height: 1.5; }

  /* ── Tour rail ──
     Present only while this surface is a step in the guided tour. It is the
     one control that is the same object on every demo, so moving on never
     depends on finding a different button in a different place. */
  .tour-rail {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 9px 10px 9px 16px;
    background: var(--interactive, #121212);
    border: 1px solid var(--line, rgba(255,255,255,.12));
    border-radius: 999px;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
    z-index: 50;
  }
  .tour-rail[data-on="1"] { display: flex; }
  .tour-step {
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--fg-faint, rgba(255,255,255,.4)); white-space: nowrap;
  }
  .tour-next {
    font: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--bg, #0a0a0a); background: var(--fg, #fff);
    border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer;
    white-space: nowrap;
  }
  .tour-next:disabled { opacity: .4; cursor: default; }
  .tour-next:focus-visible { outline: 2px solid var(--fg, #fff); outline-offset: 2px; }
  @media (max-width: 620px) { .tour-rail { left: 14px; right: 14px; justify-content: space-between; } }
  /* The rail floats over the bottom-right corner, which is exactly where a
     demo puts its own primary action — it was swallowing the clicks on Send.
     A page that is a tour step yields that corner. */
  html[data-tour="1"] footer { padding-right: 208px; }
  @media (max-width: 620px) {
    html[data-tour="1"] footer { padding-right: 0; padding-bottom: 66px; }
  }
  .escape {
    display: block;
    padding: 10px 4px 14px;
    text-align: center;
    font-size: 12.5px;
    color: rgba(255,255,255,.45);
    text-decoration: none;
  }
  .escape:hover { color: rgba(255,255,255,.85); text-decoration: underline; }
  @media (prefers-color-scheme: light) {
    .escape { color: rgba(11,12,14,.5); }
    .escape:hover { color: rgba(11,12,14,.9); }
  }
</style>
</head>
<body>
<header><h1>{{title}}</h1></header>
<main id="player"></main>
<script>
  const params = window.__TEMPLATE_PARAMS || {};
  const player = document.getElementById("player");

  function youtubeId(url) {
    const u = new URL(url);
    if (u.hostname === "youtu.be") return u.pathname.slice(1).split("/")[0];
    if (u.hostname.endsWith("youtube.com")) {
      if (u.pathname === "/watch") return u.searchParams.get("v");
      const parts = u.pathname.split("/").filter(Boolean);
      if (["embed", "shorts", "live"].includes(parts[0])) return parts[1];
    }
    return null;
  }

  function buildSrc(raw) {
    const id = youtubeId(raw);
    const start = Math.max(0, Number(params.start || 0) || 0);
    const autoplay = !!params.autoplay;
    const loop = !!params.loop;
    if (id) {
      const q = new URLSearchParams();
      q.set("rel", "0");
      q.set("modestbranding", "1");
      q.set("playsinline", "1");
      if (start) q.set("start", String(start));
      if (autoplay) { q.set("autoplay", "1"); q.set("mute", "1"); }
      if (loop) { q.set("loop", "1"); q.set("playlist", id); }
      return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?" + q.toString();
    }
    return raw;
  }

  try {
    const raw = String(params.url || "");
    const src = buildSrc(raw);
    const iframe = document.createElement("iframe");
    iframe.src = src;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    player.appendChild(iframe);

    // A refused embed is a cross-origin document: we cannot see that YouTube
    // decided not to play, so we cannot swap in a fallback. What we can do is
    // never leave the dead end without an exit — the original link is always
    // one click away, under the player rather than instead of it.
    if (youtubeId(raw)) {
      const out = document.createElement("a");
      out.className = "escape";
      out.href = raw;
      out.target = "_blank";
      out.rel = "noopener noreferrer";
      out.textContent = "Won't play here? Watch it on YouTube \u2197";
      player.parentNode.appendChild(out);
    }
  } catch (err) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "Could not render video: " + err.message;
    player.appendChild(div);
  }
</script>
  <div class="tour-rail" id="tour-rail">
    <span class="tour-step" id="tour-step"></span>
    <button class="tour-next" id="tour-next" type="button">Next</button>
  </div>

  <script>
  // The tour rail. Every demo carries the identical control so that "move on"
  // is one gesture in one place, and pressing it is an ordinary action — the
  // agent is what advances the tour, not the page.
  (function () {
    function init() {
      var P = window.__TEMPLATE_PARAMS || {};
      if (!P.tour_step && !P.tour_next) return;
      var rail = document.getElementById("tour-rail");
      var step = document.getElementById("tour-step");
      var next = document.getElementById("tour-next");
      if (!rail || !next) return;

      rail.setAttribute("data-on", "1");
      document.documentElement.setAttribute("data-tour", "1");
      step.textContent = String(P.tour_step || "");
      next.textContent = String(P.tour_next || "Next");
      next.addEventListener("click", function () {
        next.disabled = true;
        next.textContent = "Coming up…";
        var Surface = window.Surface || { action: function () {} };
        Surface.action("next", { from: P.tour_id || null });
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
