<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauge</title>
<style>
  :root {
    --bg: #0a0a0a; --interactive: #121212; --fg: #ffffff;
    --fg-muted: rgba(255,255,255,.62); --fg-faint: rgba(255,255,255,.40);
    --line: rgba(255,255,255,.12); --track: rgba(255,255,255,.10); --ok: #34d399;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f6f7; --interactive: #ffffff; --fg: #0b0c0e;
      --fg-muted: rgba(11,12,14,.62); --fg-faint: rgba(11,12,14,.42);
      --line: rgba(11,12,14,.12); --track: rgba(11,12,14,.10); --ok: #067647;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; overflow: hidden;
  }
  main { margin: auto; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .title { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-faint); }
  .dial { position: relative; width: min(62vw, 260px); aspect-ratio: 1; }
  svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .track { fill: none; stroke: var(--track); stroke-width: 10; }
  /* One transition on one property — the number moving is the whole point, and
     anything springier turns a reading into an animation. */
  .arc {
    fill: none; stroke: var(--fg); stroke-width: 10; stroke-linecap: round;
    transition: stroke-dashoffset .5s cubic-bezier(.22,1,.36,1);
  }
  .readout {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .value { font-size: clamp(38px, 12vw, 60px); font-weight: 600; letter-spacing: -.045em; font-variant-numeric: tabular-nums; line-height: 1; }
  .unit { font-size: 14px; color: var(--fg-muted); }
  .label { font-size: 13px; color: var(--fg-muted); text-align: center; max-width: 30ch; }
  .note { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-muted); min-height: 18px; text-align: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  @media (prefers-reduced-motion: reduce) { .arc { transition: none; } }

  /* ── Tour rail ──
     Present only while this surface is a step in the guided tour. It is the
     one control that is the same object on every demo, so moving on never
     depends on finding a different button in a different place. */
  .tour-rail {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 9px 10px 9px 16px;
    background: var(--interactive, #121212);
    border: 1px solid var(--line, rgba(255,255,255,.12));
    border-radius: 999px;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
    z-index: 50;
  }
  .tour-rail[data-on="1"] { display: flex; }
  .tour-step {
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--fg-faint, rgba(255,255,255,.4)); white-space: nowrap;
  }
  .tour-next {
    font: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--bg, #0a0a0a); background: var(--fg, #fff);
    border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer;
    white-space: nowrap;
  }
  .tour-next:disabled { opacity: .4; cursor: default; }
  .tour-next:focus-visible { outline: 2px solid var(--fg, #fff); outline-offset: 2px; }
  @media (max-width: 620px) { .tour-rail { left: 14px; right: 14px; justify-content: space-between; } }
  /* The rail floats over the bottom-right corner, which is exactly where a
     demo puts its own primary action — it was swallowing the clicks on Send.
     A page that is a tour step yields that corner. */
  html[data-tour="1"] footer { padding-right: 208px; }
  @media (max-width: 620px) {
    html[data-tour="1"] footer { padding-right: 0; padding-bottom: 66px; }
  }
</style>
</head>
<body>
  <main>
    <div class="title">{{title}}</div>
    <div class="dial">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"></circle>
        <circle class="arc" id="arc" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="readout">
        <span class="value" id="value">0</span>
        <span class="unit" id="unit"></span>
      </div>
    </div>
    <div class="label" id="label">{{caption}}</div>
    <div class="note" id="note"></div>
  </main>

  <script>
  (function () {
    function init() {
      var Surface = window.Surface || { state: {}, onState: function () { return function () {}; } };
      var P = window.__TEMPLATE_PARAMS || {};
      var max = Number(P.max) > 0 ? Number(P.max) : 100;
      var CIRC = 2 * Math.PI * 52;

      var arc = document.getElementById("arc");
      var valueEl = document.getElementById("value");
      var unitEl = document.getElementById("unit");
      var labelEl = document.getElementById("label");
      var noteEl = document.getElementById("note");

      arc.style.strokeDasharray = CIRC;
      arc.style.strokeDashoffset = CIRC;
      unitEl.textContent = String(P.unit || "");
      if (!String(P.caption || "").trim()) labelEl.style.display = "none";

      function render() {
        var st = Surface.state || {};
        var v = Number(st.value);
        if (!isFinite(v)) v = 0;
        var frac = Math.min(1, Math.max(0, v / max));
        arc.style.strokeDashoffset = CIRC * (1 - frac);
        // Whole numbers read as a measurement; a trailing .0 reads as a bug.
        valueEl.textContent = Math.abs(v % 1) < 0.05 ? String(Math.round(v)) : v.toFixed(1);

        if (st.label != null && String(st.label)) {
          labelEl.textContent = String(st.label);
          labelEl.style.display = "";
        }
        noteEl.textContent = "";
        if (st.note) {
          var d = document.createElement("span");
          d.className = "dot";
          noteEl.appendChild(d);
          noteEl.appendChild(document.createTextNode(String(st.note)));
        }
      }

      Surface.onState(render);
      render();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
  <div class="tour-rail" id="tour-rail">
    <span class="tour-step" id="tour-step"></span>
    <button class="tour-next" id="tour-next" type="button">Next</button>
  </div>

  <script>
  // The tour rail. Every demo carries the identical control so that "move on"
  // is one gesture in one place, and pressing it is an ordinary action — the
  // agent is what advances the tour, not the page.
  (function () {
    function init() {
      var P = window.__TEMPLATE_PARAMS || {};
      if (!P.tour_step && !P.tour_next) return;
      var rail = document.getElementById("tour-rail");
      var step = document.getElementById("tour-step");
      var next = document.getElementById("tour-next");
      if (!rail || !next) return;

      rail.setAttribute("data-on", "1");
      document.documentElement.setAttribute("data-tour", "1");
      step.textContent = String(P.tour_step || "");
      next.textContent = String(P.tour_next || "Next");
      next.addEventListener("click", function () {
        next.disabled = true;
        next.textContent = "Coming up…";
        var Surface = window.Surface || { action: function () {} };
        Surface.action("next", { from: P.tour_id || null });
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
